<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Wise Owl Technologies">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1026"/>
      <stop offset="1" stop-color="#2a1366"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="96" height="96" rx="22" fill="url(#bg)"/>
  <rect x="2" y="2" width="92" height="92" rx="20" fill="none" stroke="url(#neon)" stroke-width="2" opacity="0.8"/>

  <!-- owl body: wide head with small ear tufts, rounded belly -->
  <path d="M22 30 L21 13 L35 20 Q48 16 61 20 L75 13 L74 30 Q78 44 73 58 Q71 82 48 85 Q25 82 23 58 Q18 44 22 30 Z"
        fill="#0d1330" stroke="url(#neon)" stroke-width="3" stroke-linejoin="round"/>

  <!-- wings -->
  <path d="M25 56 Q27 72 38 79" fill="none" stroke="#8b5cf6" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M71 56 Q69 72 58 79" fill="none" stroke="#8b5cf6" stroke-width="2.5" stroke-linecap="round"/>

  <!-- facial disc -->
  <circle cx="36" cy="39" r="14" fill="none" stroke="#8b5cf6" stroke-width="1.5" opacity="0.6"/>
  <circle cx="60" cy="39" r="14" fill="none" stroke="#8b5cf6" stroke-width="1.5" opacity="0.6"/>

  <!-- eyes -->
  <circle cx="36" cy="39" r="9.5" fill="#050813" stroke="#22d3ee" stroke-width="2.5"/>
  <circle cx="60" cy="39" r="9.5" fill="#050813" stroke="#22d3ee" stroke-width="2.5"/>
  <circle cx="36" cy="39" r="5" fill="#22d3ee"/>
  <circle cx="60" cy="39" r="5" fill="#22d3ee"/>
  <circle cx="37.8" cy="37.2" r="1.7" fill="#ffffff"/>
  <circle cx="61.8" cy="37.2" r="1.7" fill="#ffffff"/>

  <!-- hooked beak -->
  <path d="M48 42 L43.5 52 Q48 60 52.5 52 Z" fill="#e879f9"/>

  <!-- chest feathers -->
  <path d="M37 65 L42.5 70 L48 65 L53.5 70 L59 65" fill="none" stroke="#22d3ee" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M41 73 L48 79 L55 73" fill="none" stroke="#22d3ee" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>

  <!-- circuit nodes -->
  <circle cx="21" cy="13" r="2" fill="#22d3ee"/>
  <circle cx="75" cy="13" r="2" fill="#22d3ee"/>
  <circle cx="37" cy="65" r="1.6" fill="#8b5cf6"/>
  <circle cx="59" cy="65" r="1.6" fill="#8b5cf6"/>
</svg>
